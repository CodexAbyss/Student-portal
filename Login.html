<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #333; }
    .dark-mode { background: #222; color: #fff; }
    
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ccc; }
    .dark-mode .card { background: #333; border-color: #555; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: inherit; padding: 10px 0; z-index: 10; }
    .dashboard { display: flex; gap: 20px; flex-wrap: wrap; }
    .dash-card { flex: 1; min-width: 250px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eee; }
    .dark-mode th { background: #444; }
    .dark-mode td { border-color: #555; }

    button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; }
    button:hover { background: #0056b3; }
    
    #login-page { max-width: 300px; margin: 50px auto; }
    .hidden { display: none; }
    #msg { color: red; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-page" class="card">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" style="width: 90%; margin-bottom: 10px; padding: 8px;"><br>
    <input type="password" id="password" placeholder="Password" style="width: 90%; margin-bottom: 10px; padding: 8px;"><br>
    <button id="login-btn" onclick="login()">Login</button>
    <div id="msg"></div>
  </div>

  <!-- STUDENT PORTAL SECTION -->
  <div id="portal-page" class="hidden">
    <div class="header-bar">
      <h1 id="main-heading">Student Portal</h1>
      <div>
        <button onclick="toggleTheme()">Toggle Dark/Light Mode</button>
        <button onclick="changeHeading()">Change Heading</button>
      </div>
    </div>

    <div class="dashboard">
      <div class="card dash-card">
        <h3>Top Student</h3>
        <p id="top-student">Loading...</p>
      </div>
      <div class="card dash-card">
        <h3>Portal Summary</h3>
        <p>Student records dynamically loaded from XML via AJAX.</p>
      </div>
    </div>

    <div class="card">
      <button onclick="toggleTable()">Show/Hide Table</button>
      <div id="table-container">
        <table id="student-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Course</th>
              <th>Semester</th>
              <th>Marks</th>
            </tr>
          </thead>
          <tbody id="student-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function login() {
      const userVal = document.getElementById("username").value.trim();
      const passVal = document.getElementById("password").value.trim();
      const msgDiv = document.getElementById("msg");

      if (!userVal || !passVal) {
        msgDiv.innerHTML = "Please enter both username and password.";
        return;
      }

      fetch("users.xml")
        .then(response => {
          if (!response.ok) {
            throw new Error("Could not find users.xml file.");
          }
          return response.text();
        })
        .then(str => new DOMParser().parseFromString(str, "text/xml"))
        .then(xml => {
          const users = xml.getElementsByTagName("user");
          let isValid = false;

          for (let i = 0; i < users.length; i++) {
            const u = users[i].getElementsByTagName("username")[0].textContent.trim();
            const p = users[i].getElementsByTagName("password")[0].textContent.trim();
            if (u === userVal && p === passVal) {
              isValid = true;
              break;
            }
          }

          if (isValid) {
            document.getElementById("login-page").classList.add("hidden");
            document.getElementById("portal-page").classList.remove("hidden");
            loadStudents();
          } else {
            msgDiv.innerHTML = "Invalid username or password!";
          }
        })
        .catch(error => {
          msgDiv.innerHTML = "Error loading XML. Run via local server (Live Server) or upload to GitHub Pages.";
          console.error(error);
        });
    }

    function loadStudents() {
      fetch("students.xml")
        .then(response => response.text())
        .then(str => new DOMParser().parseFromString(str, "text/xml"))
        .then(xml => {
          const students = xml.getElementsByTagName("student");
          const tbody = document.getElementById("student-tbody");
          tbody.innerHTML = "";

          let topName = "";
          let maxMarks = -1;

          for (let i = 0; i < students.length; i++) {
            const name = students[i].getElementsByTagName("name")[0].textContent;
            const course = students[i].getElementsByTagName("course")[0].textContent;
            const semester = students[i].getElementsByTagName("semester")[0].textContent;
            const marks = parseInt(students[i].getElementsByTagName("marks")[0].textContent);

            if (marks > maxMarks) {
              maxMarks = marks;
              topName = name;
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${name}</td><td>${course}</td><td>${semester}</td><td>${marks}</td>`;
            tbody.appendChild(tr);
          }

          document.getElementById("top-student").innerHTML = `<strong>${topName}</strong> (${maxMarks} marks)`;
        });
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }

    function toggleTable() {
      const container = document.getElementById("table-container");
      container.classList.toggle("hidden");
    }

    function changeHeading() {
      document.getElementById("main-heading").innerHTML = "Welcome to Dashboard!";
    }
  </script>
</body>
</html>
